name: flutter_inappwebview_linux
description: Test-only stand-in with no native code, for building without WPE WebKit.
version: 0.1.0-beta.1
publish_to: none
environment:
  sdk: ^3.5.0
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      linux:
        dartPluginClass: LinuxInAppWebViewPlatform
