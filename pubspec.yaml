name: soiboi
description: "A streaming-to-offline archival music player for local and self-hosted libraries."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.4+15

environment:
  sdk: ^3.11.0
  # Specify a fixed version to ensure consistent behavior.
  # If you want to use a newer version, add ^ before the version number,
  # or directly set the version you want.
  flutter: ^3.47.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  file_picker:
    git:
      url: https://github.com/miguelpruivo/flutter_file_picker.git
      ref: v12.0.0-beta.7
  permission_handler: ^13.0.1
  audio_tags_lofty: ^0.0.6
  audio_service: ^0.18.18
  audio_service_mpris: ^0.2.0
  audio_service_win:
    git:
      url: https://github.com/AfalpHy/audio_service_win.git
      ref: 940c576294061a6f47f2318515d617e6a9fd1b7b  # pinned; upstream tracks main
  audio_session: ^0.2.2
  media_kit: 
    git:
      url: https://github.com/AfalpHy/media-kit
      ref: 40a2f7ce28d66c61acc3e31e998d240749611d83  # pinned; upstream tracks main
      path: media_kit
  media_kit_libs_audio: ^1.0.7
  path_provider: ^2.1.5
  image: ^4.5.4
  auto_size_text: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  path: ^1.9.1
  flutter_switch: ^0.3.2
  smooth_corner: ^1.1.1
  window_manager:
    git:
        url: https://github.com/AfalpHy/window_manager.git
        ref: d18a15c8e92b2c21ff04580c7990bce32941db64  # pinned; upstream tracks main
        path: packages/window_manager
  tray_manager: ^0.5.3
  lpinyin: ^2.0.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  dio: ^5.9.2
  crypto: ^3.0.7
  charset: ^2.0.1
  pool: ^1.5.2
  screen_corner_radius: ^3.0.0
  xml: ^7.0.1
  drift: ^2.33.0
  just_font_scan: ^0.3.0
  flutter_secure_storage: ^11.0.0
  # Android sign-in: Apple's own login page in a WebView, so the app never
  # handles a password. No Linux support, hence the cookies.txt import there.
  flutter_inappwebview: ^6.2.0-beta.3
  in_app_purchase: ^3.3.0
  text_scroll: ^0.2.1
  flutter_gamepads: ^0.1.11+4
  liquid_glass_widgets: ^1.2.3
  rive_animated_icon:
    git:
      url: https://github.com/AfalpHy/rive_animated_icons.git
      ref: 81eb597af7b4b82305e5559963b8013380e2ebed  # pinned; upstream tracks main
  windows_taskbar:
    git:
      url: https://github.com/axel10/windows_taskbar.git
      ref: e5ff1f094b4376b5b81999d9da6c423177e90bba  # pinned; upstream tracks master

  intl: any
  material_ui: any
  cupertino_ui: any
  dynamic_color: ^2.1.0
dependency_overrides:
  media_kit_libs_windows_audio:
    git:
      url: https://github.com/AfalpHy/media-kit
      ref: 40a2f7ce28d66c61acc3e31e998d240749611d83  # pinned; upstream tracks main
      path: libs/windows/media_kit_libs_windows_audio
  media_kit_libs_android_audio:
    git:
      url: https://github.com/AfalpHy/media-kit
      ref: 40a2f7ce28d66c61acc3e31e998d240749611d83  # pinned; upstream tracks main
      path: libs/android/media_kit_libs_android_audio
  media_kit_libs_ios_audio:
    git:
      url: https://github.com/AfalpHy/media-kit
      ref: 40a2f7ce28d66c61acc3e31e998d240749611d83  # pinned; upstream tracks main
      path: libs/ios/media_kit_libs_ios_audio
  media_kit_libs_macos_audio:
    git:
      url: https://github.com/AfalpHy/media-kit
      ref: 40a2f7ce28d66c61acc3e31e998d240749611d83  # pinned; upstream tracks main
      path: libs/macos/media_kit_libs_macos_audio

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.3

  drift_dev: ^2.33.0
  build_runner: ^2.15.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/
    - assets/images/
    - assets/licenses/

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Flavour typefaces (SIL OFL, licences in assets/licenses/). Static
  # instances cut from Google Fonts' variable files, since FontWeight does
  # not drive a variable font's wght axis.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-400.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-700.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-400.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800

  generate: true

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

icons_launcher:
  image_path: "app_icons/icon.png"
  platforms:
    android:
      enable: true
      adaptive_background_image: "app_icons/background.png"
      adaptive_foreground_image: "app_icons/android.png"
      adaptive_monochrome_image: "app_icons/monochrome.png"
    macos:
      enable: true
    linux:
      image_path: "app_icons/win_linux.png"
      enable: true
    windows:
      image_path: "app_icons/win_linux.png"
      enable: true