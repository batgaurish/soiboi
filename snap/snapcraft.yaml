name: soiboi
version: 4.1.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-soiboi: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.soiboi # adjust accordingly to your app name

apps:
  soiboi:
    command: soiboi
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-soiboi
parts:
  soiboi:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
